# Publica el sitio en GitHub Pages:
#   https://<usuario>.github.io/<repo>/      → la app de dosis (index.html de la raíz)
#   https://<usuario>.github.io/<repo>/pdf/  → PDF Libre (herramientas-pdf)
# Requisito único: Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: herramientas-pdf/package-lock.json

      - name: Calcular rutas
        id: paths
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "base=/${repo}/pdf/" >> "$GITHUB_OUTPUT"
          echo "site=https://${owner}.github.io/${repo}/pdf" >> "$GITHUB_OUTPUT"

      - name: Compilar PDF Libre
        working-directory: herramientas-pdf
        env:
          BASE_PATH: ${{ steps.paths.outputs.base }}
          SITE_URL: ${{ steps.paths.outputs.site }}
        run: |
          npm ci
          npm run build

      - name: Armar el sitio
        run: |
          mkdir -p _site
          rsync -a --exclude herramientas-pdf --exclude .git --exclude .github --exclude _site ./ _site/
          cp -r herramientas-pdf/dist _site/pdf
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}pdf/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
